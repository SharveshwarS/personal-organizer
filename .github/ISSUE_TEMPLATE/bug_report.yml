name: Bug report
description: Report a reproducible problem without sharing personal records.
body:
  - type: markdown
    attributes:
      value: Do not attach real databases, financial entries, private notes, or credentials. Use synthetic examples. Security issues need private reporting.
  - type: input
    id: version
    attributes:
      label: App version and Windows version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
