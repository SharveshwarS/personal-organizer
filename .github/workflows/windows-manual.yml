name: Windows validation (manual)

# Maintainer-triggered Windows validation; this workflow does not publish releases.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:win
      - name: Record installer checksum
        shell: pwsh
        run: Get-FileHash release/Personal-Organizer-Setup-*.exe -Algorithm SHA256 | Format-List | Out-File release/SHA256.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-preview
          path: |
            release/Personal-Organizer-Setup-*.exe
            release/SHA256.txt
            THIRD-PARTY-NOTICES.txt
          if-no-files-found: error
          retention-days: 14
